site_name: Inovactio's Minecraft Mods
site_description: Player wikis and developer documentation for Inovactio's Minecraft mods
site_url: https://inovactio.github.io/
copyright: © Inovactio. All Rights Reserved.

theme:
  name: material
  # Template overrides: the link previews (main.html) and the page-not-found page (404.html).
  custom_dir: overrides
  # AkumaLib's logo, the base the mods share: one favicon for the whole site.
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      # Also split on the punctuation of code ("AkumaTargeting.inCone(caster" is three words, so "incone"
      # finds it), but not on the dots of a version number, so "2.5.0" is still one word.
      separator: '[\s\-,:;!=\[\]()"/]+|\.(?!\d)'

hooks:
  # Search ranking: the mod wikis before the developer pages, the changelogs last.
  - hooks/search_boost.py
  # A shared link's title, description and image, used by overrides/main.html.
  - hooks/link_previews.py

# Broken anchors fail the strict build too, not only broken pages.
validation:
  anchors: warn

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/model-viewer.css

extra_javascript:
  - assets/javascripts/sortable.js
  - assets/javascripts/model-viewer.js

# Unreleased mods: their pages stay in the repository but are not built or published.
# Add a line here for one, and remove it (adding the page back to the nav and the home page) when it is released.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

